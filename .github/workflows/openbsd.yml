name: OpenBSD

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  openbsd-interface-http:
    name: 'OpenBSD 7.9, interface_http experiment'
    runs-on: ubuntu-latest
    env:
      PACKAGES: 'boost sqlite3 capnproto zeromq qt6-qtbase qt6-qttools libqrencode'
      REPOSITORY: pinheadmz/bitcoin
      REF: interface-http-openbsd
    defaults:
      run:
        shell: openbsd {0}

    steps:
      - name: Start OpenBSD 7.9 VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          prepare: pkg_add -U -v curl gtar-- cmake-core ninja python%3 py3-pip py3-zmq ${{ env.PACKAGES }}
          sync: rsync
          disable-cache: true

      - name: Fetch source tarball
        run: |
          set -e
          curl --location --fail --output source.tar.gz https://github.com/${{ env.REPOSITORY }}/archive/${{ env.REF }}.tar.gz
          mkdir /home/bitcoin
          gtar -xf source.tar.gz -C /home/bitcoin --strip-components=1
          rm -rf source.tar.gz

      - name: Generate CTest configuration
        run: |
          cat << 'EOF' > ctest_config.cmake
          set(CTEST_SITE "${{ github.repository }}")
          set(CTEST_BUILD_NAME "OpenBSD 7.9, interface_http experiment")
          set(CTEST_SOURCE_DIRECTORY "/home/bitcoin")
          set(CTEST_BINARY_DIRECTORY "/home/build")
          set(CTEST_CMAKE_GENERATOR "Ninja")
          cmake_host_system_information(RESULT nproc QUERY NUMBER_OF_LOGICAL_CORES)
          EOF

      - name: CDash -- Configure
        run: |
          cat << 'EOF' > ctest_configure.cmake
          include(ctest_config.cmake)
          set(configure_opts
            "--preset dev-mode"
            "-DWITH_USDT=OFF"
            "-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
          )
          ctest_start(Experimental)
          ctest_configure(OPTIONS "${configure_opts}")
          EOF
          ctest --extra-verbose --script ctest_configure.cmake

      - name: CDash -- Build
        run: |
          cat << 'EOF' > ctest_build.cmake
          include(ctest_config.cmake)
          ctest_start(APPEND)
          ctest_build(PARALLEL_LEVEL ${nproc})
          EOF
          ctest --extra-verbose --script ctest_build.cmake

      - name: Check 'bitcoind' executable
        run: |
          set -e
          ls -l /home/build/bin/bitcoind
          file /home/build/bin/bitcoind
          /home/build/bin/bitcoind -version

      - name: Install functional test dependencies
        run: |
          set -e
          # The system's `capnproto` package ships static libraries
          # built without -fPIC, causing relocation errors when linking
          # pycapnp's shared extension module.
          #
          # A two-part workaround is applied:
          #  1. Force building the bundled libcapnp, which is compiled
          #     with -fPIC.
          #  2. Override LDCXXSHARED to drop the -L/usr/local/lib/ that
          #     Python's sysconfig injects ahead of the bundled library
          #     directories, and which would otherwise resolve -lcapnp*
          #     and -lkj* to the system's static archives.
          if pkg_info -e 'capnproto-*'; then
            LDCXXSHARED="c++ -pthread -shared -fPIC" pip3 install --break-system-packages pycapnp -C force-bundled-libcapnp=True
          else
            pip3 install --break-system-packages pycapnp
          fi
          python3 --version
          python3 -c "import sqlite3; print(f'SQLite {sqlite3.sqlite_version}')"
          python3 -c "import zmq; print(f'pyzmq {zmq.__version__} / libzmq {zmq.zmq_version()}')"

      - name: Run full extended suite like hebasto/bitcoin-core-nightly PR369
        run: |
          set -e
          ulimit -n 1024
          export PYTHONUNBUFFERED=1

          # Capture runs as root (OpenBSD has no sudo; doas if needed).
          SUDO_PREFIX=""
          if [ "$(id -u)" != 0 ]; then
            if command -v doas >/dev/null 2>&1 && doas -n true 2>/dev/null; then
              SUDO_PREFIX="doas -n"
            elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              SUDO_PREFIX="sudo -n"
            fi
          fi

          CAPTURE_FILE="$(pwd)/interface_http.pcap"
          CAPTURE_ENABLED=1
          if ! command -v tcpdump >/dev/null 2>&1; then
            echo "WARNING: tcpdump unavailable; packet capture disabled"
            CAPTURE_ENABLED=0
          fi

          stop_capture() {
            ${SUDO_PREFIX} pkill -x tcpdump 2>/dev/null || true
            wait "${CAPTURE_SHELL_PID}" 2>/dev/null || true
            sleep 1
            ${SUDO_PREFIX} chmod 644 interface_http.pcap* 2>/dev/null || true
          }

          start_capture() {
            # -C 32 -W 8: circular ring of 8 x 32MB so a long suite/hang can't
            # fill the disk; the most recent traffic is always retained.
            rm -f interface_http.pcap*
            ${SUDO_PREFIX} tcpdump -i lo0 -n -s 0 -U -w "${CAPTURE_FILE}" -C 32 -W 8 tcp 2>/dev/null &
            CAPTURE_SHELL_PID=$!
            sleep 1
            if [ ! -s "${CAPTURE_FILE}" ]; then
              echo "WARNING: tcpdump did not start writing ${CAPTURE_FILE}; packet capture disabled"
              CAPTURE_ENABLED=0
            fi
          }

          collect_evidence() {
            echo "=== collecting test tmpdirs from the VM ==="
            if ls -d /home/test_runner_* >/dev/null 2>&1; then
              tar czf "$(pwd)/interface_http-debug.tar.gz" /home/test_runner_* 2>/dev/null || true
              ls -l interface_http-debug.tar.gz || true
            fi
          }

          # ---- Phase 1: full extended suite, exactly like PR 369 (-j 8) ----
          # interface_http.py is expected to pass solo (7 s on this VM) but
          # hung >5 h twice in hebasto's runs as the last remaining suite
          # job. Run the whole suite under a hard timeout so a hang is
          # converted into artifacts instead of a silent 5-hour wait.
          #
          # WATCHDOG_HANG_DEBUG=1 (in test/functional/test_runner.py) streams
          # every running test's output to <tmpdir>/live/<name>.live.log, so
          # if the suite hangs we can read exactly where inside the test.
          export WATCHDOG_HANG_DEBUG=1
          if ! timeout 14400 /home/build/test/functional/test_runner.py -j 8 --combinedlogslen=99999999 --tmpdirprefix /home --extended --exclude feature_reindex_init --exclude interface_rest --exclude p2p_private_broadcast_retry_v1 --exclude wallet_send --timeout-factor=8 > suite.log 2>&1; then
            suite_rc=$?
            if [ "${suite_rc}" = 124 ]; then
              echo "=== SUITE TIMED OUT after 14400s (test hang, like hebasto issue 368) ==="
            else
              echo "=== SUITE FAILED, rc=${suite_rc} ==="
            fi
            echo "--- suite.log (tail) ---"
            tail -100 suite.log || true
            echo "--- live logs of still-running tests (hang position) ---"
            for f in /home/test_runner_*/live/*.live.log; do
              [ -f "${f}" ] || continue
              echo "--- ${f} (last 30 lines) ---"
              tail -30 "${f}" || true
            done
            stop_capture
            collect_evidence
            exit 1
          fi
          echo "=== SUITE PASSED (no hang observed under -j 8) ==="
          stop_capture

      - name: Solo-loop interface_http with per-iteration watchdog
        run: |
          set -e
          ulimit -n 1024
          export PYTHONUNBUFFERED=1

          SUDO_PREFIX=""
          if [ "$(id -u)" != 0 ]; then
            SUDO_PREFIX="doas -n"
          fi

          CAPTURE_FILE="$(pwd)/interface_http.pcap"
          CAPTURE_ENABLED=1
          stop_capture() {
            ${SUDO_PREFIX} pkill -x tcpdump 2>/dev/null || true
            sleep 1
            ${SUDO_PREFIX} chmod 644 interface_http.pcap* 2>/dev/null || true
          }
          start_capture() {
            rm -f interface_http.pcap*
            ${SUDO_PREFIX} tcpdump -i lo0 -n -s 0 -U -w "${CAPTURE_FILE}" -C 32 -W 8 tcp 2>/dev/null &
            CAPTURE_SHELL_PID=$!
            sleep 1
          }

          # Each solo iteration gets a 900 s watchdog: the test passes in ~7 s
          # here, so a hang (the thing we hunt) is cut short and evidence is
          # preserved. On any fail/timeout the tmpdirs are collected for
          # post-mortem. Loop until GH's 6h job limit otherwise.
          #
          # The loop is time-capped at 4h30m so a final rsync copyback and the
          # artifact-upload steps still run inside GitHub's 6h job limit --
          # a 6h kill would silently destroy everything in the VM.
          LOOP_DEADLINE=$(( $(date +%s) + 16200 ))
          i=0
          while true; do
            now=$(date +%s)
            if [ "${now}" -ge "${LOOP_DEADLINE}" ]; then
              echo "=== LOOP REACHED 4h30m WALL-CLOCK CAP after ${i} clean iterations; stopping cleanly ==="
              exit 0
            fi
            if [ "${CAPTURE_ENABLED}" = 1 ]; then
              start_capture
            fi
            if timeout 900 /home/build/test/functional/test_runner.py interface_http --combinedlogslen=99999999 --tmpdirprefix /home --timeout-factor=8 > iteration.log 2>&1; then
              i=$((i + 1))
              echo "=== interface_http iteration ${i} PASSED ==="
              # Heartbeat: append a compact progress trace so any later
              # snapshot shows how far the loop got and iteration pace.
              echo "$(date -u +%FT%TZ) iteration ${i} PASSED" >> live-debug.txt
              if [ "${CAPTURE_ENABLED}" = 1 ]; then
                stop_capture
              fi
              continue
            fi
            test_rc=$?
            if [ "${test_rc}" = 124 ]; then
              echo "=== interface_http iteration $((i + 1)) TIMED OUT after 900s ==="
            else
              echo "=== interface_http FAILED (iteration $((i + 1))), rc=${test_rc} ==="
            fi
            echo "$(date -u +%FT%TZ) iteration $((i + 1)) rc=${test_rc}" >> live-debug.txt
            echo "--- iteration.log (tail) ---"
            tail -100 iteration.log || true
            if [ "${CAPTURE_ENABLED}" = 1 ]; then
              stop_capture
            fi
            echo "=== collecting test tmpdirs from the VM ==="
            if ls -d /home/test_runner_* >/dev/null 2>&1; then
              tar czf "$(pwd)/interface_http-debug.tar.gz" /home/test_runner_* 2>/dev/null || true
            fi
            exit 1
          done

      - name: Snapshot live logs (mid-run evidence)
        if: always()
        run: |
          # A no-op VM shell: with sync:rsync, ending ANY vm-side step pulls
          # the VM workspace back to the host. Steps are cheap; the uploads
          # below then grab whatever evidence exists. To keep mid-run
          # snapshots flowing, the solo loop itself periodically writes the
          # tail of iteration.log into live-debug.txt inside the workspace.
          echo "snapshot tick: $(date)"
      - name: Upload packet capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface_http-pcap-openbsd-${{ github.run_id }}
          path: interface_http.pcap*
          if-no-files-found: ignore

      - name: Upload live-debug heartbeat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface_http-heartbeat-openbsd-${{ github.run_id }}
          path: live-debug.txt
          if-no-files-found: ignore

      - name: Upload test debug logs and data dirs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface_http-debug-openbsd-${{ github.run_id }}
          path: interface_http-debug.tar.gz
          if-no-files-found: ignore